[build-system]
    requires      = ["setuptools>=68,<81", "wheel"]
    build-backend = "setuptools.build_meta"

[project]
    name = "ehp-research"
    description = "Entorhinal-Hippocampal Circuit (EHP) Research library"
    authors = [{ name = "Borja Esteban Sanchis" }]
    license = { text = "GNU General Public License v3.0" }
    classifiers = [
        "Intended Audience :: Science/Research",
        "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
        "Programming Language :: Python :: 3",
        "Programming Language :: Python :: 3.12",
        "Topic :: Scientific/Engineering :: Artificial Intelligence",
        "Topic :: Scientific/Engineering :: Bio-Informatics",
        "Topic :: Scientific/Engineering :: Neuroscience",
    ]
    keywords = [
        "neuroscience",
        "spatial navigation",
        "hippocampus",
        "entorhinal cortex",
        "neural modeling",
    ]
    requires-python = ">=3.12"
    dynamic = ["version", "readme"]
    dependencies = [
        "ehp-sn>=0.1.0",
    ]

[project.urls]
    "Homepage"      = "https://github.com/BorjaEst/ehp-sn"
    "Bug Tracker"   = "https://github.com/BorjaEst/ehp-sn/issues"
    "Documentation" = "https://ehp-sn.readthedocs.io"

[tool.setuptools]
    package-dir = { "" = "src" }

[tool.setuptools.packages.find]
    where   = ["src"]

[tool.setuptools.dynamic]
    version = { file = "VERSION" }
    readme  = { file = "README.md" }

[tool.setuptools.package-data]
    ehp_research = ["py.typed", "**/*.yaml", "**/*.yml"]

