# ObsField `weighted-random` — independent categorical assignment by explicit vector
#
# Reusable concrete realization of substrate:obsfield/v1 (categorical-complete
# variant), selected by the generic `ehp-sn data` lifecycle:
#
#   ehp-sn data plan substrate:obsfield/v1 --config config/data/obsfield/weighted-random.toml
#
# Each ambient position independently receives a categorical observation drawn
# according to an explicitly declared probability vector over the declared
# vocabulary (repeats permitted). ObsField is topology-independent and defines
# no intrinsic splits. The vector is a valid categorical probability vector for
# the declared cardinality.
#
# NOTE (provisional identity): `categorical-random/v1` is the assignment protocol
# documented by the obsfield/v1 spec as the initial (and sole) permitted protocol;
# it is provisional until an ObsField builder is registered.

[substrate]
    variant = "categorical-complete"

[domain]
    schema = "rectangular-grid/v1"
    height = 30
    width  = 30

[vocabulary]
    identity    = "obs-vocabulary:anonymous-4/v1"
    cardinality = 4

[assignment]
    protocol = "categorical-random/v1"

[assignment.parameters]
    distribution = [0.50, 0.25, 0.15, 0.10]

[generation]
    seed              = 0
    realization_count = 100
