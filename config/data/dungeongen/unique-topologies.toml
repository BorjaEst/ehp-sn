# DungeonGen `unique-topologies` — structurally unique irregular raster
# topologies (reject-exact duplicate policy).
#
# FUTURE / NOT-YET-REGISTERED (Phase 5.3): the first executable profile uses the
# `allow` duplicate policy (independent-realizations.toml). The `reject-exact`
# policy is defined but not yet implemented; the DungeonGen resolver rejects a
# config declaring it cleanly rather than silently downgrading to `allow`. This
# profile keeps the real frozen dependency and can be enabled once reject-exact
# is implemented and registered.
#
# Reusable concrete realization of substrate:dungeongen/v1 (general variant),
# selected by the generic `ehp-sn data` lifecycle:
#
#   ehp-sn data plan substrate:dungeongen/v1 --config config/data/dungeongen/unique-topologies.toml
#
# Dependency identity frozen (Phase 5.3): dungeongen==0.1.14 at upstream Git
# revision 2d228f5d3f82ccaa4666b087942100e7800fb069.

[substrate]
    variant = "general"

[generator]
    dependency = "git:benjcooley/dungeongen@2d228f5d3f82ccaa4666b087942100e7800fb069"
    protocol   = "dungeongen/generation/v1"
    profile    = "dungeongen/profile/general/v1"

# Resolved generator parameter declaration — the complete effective
# `GenerationParams` surface for this profile. Each value is the EHP-owned
# default; a configuration may omit any field and resolve through the EHP-owned
# default. `size` and `room_count` are mutually exclusive.
[generator.params]
    archetype               = "classic"
    size                    = "medium"
    room_size_bias          = 0.0
    round_room_chance       = 0.15
    hall_chance             = 0.1
    density                 = 0.5
    symmetry                = "none"
    symmetry_break          = 0.2
    linearity               = 0.3
    loop_factor             = 0.3
    passage_width           = 1
    winding                 = 0.0
    extra_room_connections  = 0.2
    extra_passage_junctions = 0.15
    levels                  = 1
    stair_frequency         = 0.1
    water_enabled           = false
    water_threshold         = 0.15

[conversion]
    policy = "dungeongen:conversion/raster/v1"

[acceptance]
    policy            = "dungeongen:acceptance/size-and-connected/v1"
    require_connected = true

[generation]
    attempt_budget = 200
    seed           = 0
    record_count   = 200
    role           = "topology-candidate"

[topology]
    duplicate_policy = "reject-exact"

[topology.size_policy]
    minimum_height = 4
    maximum_height = 128
    minimum_width  = 4
    maximum_width  = 128
    minimum_states = 32
    maximum_states = 1024
