[resource]
schema = "dungeongen/generator-resource/v1"

[generator]
protocol = "dungeongen/generation/v1"
profile  = "dungeongen/profile/general/v1"

[generator.params]
archetype               = "classic"
size                    = "medium"
room_size_bias          = 0.0
round_room_chance       = 0.15
hall_chance             = 0.10
density                 = 0.50
symmetry                = "none"
symmetry_break          = 0.20
linearity               = 0.30
loop_factor             = 0.30
passage_width           = 1
winding                 = 0.0
extra_room_connections  = 0.20
extra_passage_junctions = 0.15
levels                  = 1
stair_frequency         = 0.10
water_enabled           = false
water_threshold         = 0.15
