schema = "ehp-sn/experiment/v1"
ref    = "experiment:mazehard-hrm/v1"


# ---------------------------------------------------------------------------
# Substrates
# ---------------------------------------------------------------------------

[substrates.topology]
producer = "substrate:maze-nd/v1"
config   = "config/data/maze-nd/mazehard-reference-30x30.toml"


# ---------------------------------------------------------------------------
# Task
# ---------------------------------------------------------------------------

[task]
ref    = "task:mazehard/v1"
config = "config/tasks/mazehard/default.toml"


[task.corpora.main]
config = "config/tasks/mazehard/source-reproduction-30x30-1k.toml"


[task.corpora.main.parents]
topology = "substrates.topology"


# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

[model]
ref    = "model:hrm/v1"
config = "config/models/hrm/mazehard-reference.toml"


# ---------------------------------------------------------------------------
# Binding
# ---------------------------------------------------------------------------

[binding]
joint = "config/bindings/mazehard-hrm/joint.toml"


[binding.input]
adapter = "adapter:raster-sequence/v1"
config  = "config/bindings/raster-sequence/mazehard.toml"


[binding.output]
adapter = "adapter:raster-prediction/v1"
config  = "config/bindings/raster-prediction/mazehard.toml"


# ---------------------------------------------------------------------------
# Objectives
# ---------------------------------------------------------------------------

[objectives]
composition = "config/objectives/mazehard-hrm/composition.toml"


[objectives.components.route]
ref    = "objective:stablemax-cross-entropy/v1"
config = "config/objectives/mazehard-hrm/route.toml"


[objectives.components.act]
ref    = "objective:supervised-act/v1"
config = "config/objectives/mazehard-hrm/act.toml"


# ---------------------------------------------------------------------------
# Training / evaluation
# ---------------------------------------------------------------------------

[training]
protocol = "config/train/mazehard-hrm/reference.toml"


[evaluation]
protocol = "config/evaluate/mazehard-hrm/reference.toml"
