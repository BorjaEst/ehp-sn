schema = "ehp-sn/experiment/v1"
ref    = "experiment:arena-tem/v1"


# ---------------------------------------------------------------------------
# Substrates
# ---------------------------------------------------------------------------

[substrates.topology]
producer = "substrate:dungeongen/v1"
config   = "config/data/dungeongen/arena-random-30x30.toml"


[substrates.observation_field]
producer = "substrate:obsfield/v1"
config   = "config/data/obsfield/grid30x30-45-uniform.toml"


# ---------------------------------------------------------------------------
# Task
# ---------------------------------------------------------------------------

[task]
ref    = "task:arena/v1"
config = "config/tasks/arena/default.toml"


[task.corpora.main]
config = "config/tasks/arena/dungeongen-random-30x30.toml"


[task.corpora.main.parents]
topology          = "substrates.topology"
observation_field = "substrates.observation_field"


# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

[model]
ref    = "model:tem/v1"
config = "config/models/tem/reference.toml"


# ---------------------------------------------------------------------------
# Model IO
# ---------------------------------------------------------------------------

[model_io.input]
adapter = "adapter:relational-sequence/v1"
config  = "config/bindings/relational-sequence/arena.toml"


[model_io.output]
adapter = "adapter:observation-prediction/v1"
config  = "config/bindings/observation-prediction/arena-tem.toml"


# ---------------------------------------------------------------------------
# Objectives
# ---------------------------------------------------------------------------

[objectives]
composition = "config/objectives/arena-tem/composition.toml"


[objectives.components.posterior]
ref    = "objective:categorical-cross-entropy/v1"
config = "config/objectives/arena-tem/posterior.toml"


[objectives.components.sensory_recall]
ref    = "objective:categorical-cross-entropy/v1"
config = "config/objectives/arena-tem/sensory-recall.toml"


[objectives.components.structural_prior]
ref    = "objective:categorical-cross-entropy/v1"
config = "config/objectives/arena-tem/structural-prior.toml"


# ---------------------------------------------------------------------------
# Training / evaluation
# ---------------------------------------------------------------------------

[training]
protocol = "config/train/arena-tem/reference.toml"


[evaluation]
protocol = "config/evaluate/arena-tem/reference.toml"
