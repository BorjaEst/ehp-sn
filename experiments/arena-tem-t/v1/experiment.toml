schema = "ehp-sn/experiment/v1"
ref    = "experiment:arena-tem-t/v1"


# ---------------------------------------------------------------------------
# Substrates
# ---------------------------------------------------------------------------

[substrates.topology]
producer = "substrate:dungeon/v1"
config   = "config/data/dungeon/arena-random-30x30.toml"


[substrates.observation_field]
producer = "substrate:obsfield/v1"
config   = "config/data/obsfield/arena-random-30x30.toml"


# ---------------------------------------------------------------------------
# Task
# ---------------------------------------------------------------------------

[task]
ref    = "task:arena/v1"
config = "config/tasks/arena/default.toml"


[task.corpora.main]
config = "config/tasks/arena/dungeon-random-30x30-t250.toml"


[task.corpora.main.parents]
topology          = "substrates.topology"
observation_field = "substrates.observation_field"


# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

[model]
ref    = "model:tem-t/v1"
config = "config/models/tem-t/arena-reference.toml"


# ---------------------------------------------------------------------------
# Model IO
# ---------------------------------------------------------------------------

[model_io.input]
adapter = "adapter:relational-sequence/v1"
config  = "config/bindings/relational-sequence/arena.toml"


[model_io.output]
adapter = "adapter:observation-prediction/v1"
config  = "config/bindings/observation-prediction/arena-tem-t.toml"


# ---------------------------------------------------------------------------
# Objectives
# ---------------------------------------------------------------------------

[objectives.components.observation]
ref    = "objective:categorical-cross-entropy/v1"
config = "config/objectives/arena-tem-t/observation.toml"


# ---------------------------------------------------------------------------
# Training / evaluation
# ---------------------------------------------------------------------------

[training]
protocol = "config/train/arena-tem-t/reference.toml"


[evaluation]
protocol = "config/evaluate/arena-tem-t/reference.toml"
