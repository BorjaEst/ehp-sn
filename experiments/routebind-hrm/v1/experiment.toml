schema = "ehp-sn/experiment/v1"
ref    = "experiment:routebind-hrm/v1"


# ---------------------------------------------------------------------------
# Substrates
# ---------------------------------------------------------------------------

[substrates.topology]
producer = "substrate:dungeongen/v1"
config   = "config/data/dungeongen/routebind-dungeon30.toml"


[substrates.observation_field]
producer = "substrate:obsfield/v1"
config   = "config/data/obsfield/routebind-dungeon30.toml"


[substrates.semantic_graph]
producer = "substrate:dagflow/v1"
config   = "config/data/dagflow/routebind-chain16.toml"


# ---------------------------------------------------------------------------
# Task
# ---------------------------------------------------------------------------

[task]
ref    = "task:routebind/v1"
config = "config/tasks/routebind/default.toml"


[task.corpora.main]
config = "config/tasks/routebind/chain16-dungeon30.toml"


[task.corpora.main.parents]
topology          = "substrates.topology"
observation_field = "substrates.observation_field"
semantic_graph    = "substrates.semantic_graph"


# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

[model]
ref    = "model:hrm/v1"
config = "config/models/hrm/routebind-baseline.toml"


# ---------------------------------------------------------------------------
# Model IO
# ---------------------------------------------------------------------------

[model_io.input]
adapter = "adapter:raster-overlay-sequence/v1"
config  = "config/bindings/raster-overlay-sequence/routebind.toml"


[model_io.output]
adapter = "adapter:raster-field-prediction/v1"
config  = "config/bindings/raster-field-prediction/routebind.toml"


# ---------------------------------------------------------------------------
# Objectives
# ---------------------------------------------------------------------------

[objectives]
composition = "config/objectives/routebind-hrm/composition.toml"


[objectives.components.trajectory]
ref    = "objective:support-balanced-bce-with-logits/v1"
config = "config/objectives/routebind-hrm/trajectory.toml"


[objectives.components.waypoint]
ref    = "objective:support-balanced-bce-with-logits/v1"
config = "config/objectives/routebind-hrm/waypoint.toml"


[objectives.components.act]
ref    = "objective:supervised-act/v1"
config = "config/objectives/routebind-hrm/act.toml"


# ---------------------------------------------------------------------------
# Training / evaluation
# ---------------------------------------------------------------------------

[training]
protocol = "config/train/routebind-hrm/reference.toml"


[evaluation]
protocol = "config/evaluate/routebind-hrm/reference.toml"
