schema = "ehp-sn/experiment/v1"
ref    = "experiment:mazehard-hrm-rl/v1"


# ---------------------------------------------------------------------------
# Substrates
# ---------------------------------------------------------------------------

[substrates.topology]
producer = "substrate:maze-nd/v1"
config   = "config/data/maze-nd/mazehard-reference-30x30.toml"


# ---------------------------------------------------------------------------
# Task
# ---------------------------------------------------------------------------

[task]
ref    = "task:mazehard/v1"
config = "config/tasks/mazehard/default.toml"


[task.corpora.main]
config = "config/tasks/mazehard/reference-30x30.toml"


[task.corpora.main.parents]
topology = "substrates.topology"


# ---------------------------------------------------------------------------
# Model
# ---------------------------------------------------------------------------

[model]
ref    = "model:hrm-rl/v1"
config = "config/models/hrm-rl/mazehard-reference.toml"


# ---------------------------------------------------------------------------
# Binding
# ---------------------------------------------------------------------------

[binding]
joint = "config/bindings/mazehard-hrm-rl/joint.toml"


[binding.input]
adapter = "adapter:raster-sequence/v1"
config  = "config/bindings/raster-sequence/mazehard.toml"


[binding.output]
adapter = "adapter:raster-prediction/v1"
config  = "config/bindings/raster-prediction/mazehard.toml"


# ---------------------------------------------------------------------------
# Controller
# ---------------------------------------------------------------------------

[controller]
ref    = "controller:q-deliberation/v1"
config = "config/controllers/q-deliberation/mazehard-reference.toml"


# ---------------------------------------------------------------------------
# Objectives
# ---------------------------------------------------------------------------

[objectives]
composition = "config/objectives/mazehard-hrm-rl/composition.toml"


[objectives.components.route]
ref    = "objective:categorical-cross-entropy/v1"
config = "config/objectives/mazehard-hrm-rl/route.toml"


[objectives.components.rl]
ref    = "objective:q-deliberation-td/v1"
config = "config/objectives/mazehard-hrm-rl/rl.toml"


# ---------------------------------------------------------------------------
# Training / evaluation
# ---------------------------------------------------------------------------

[training]
protocol = "config/train/mazehard-hrm-rl/reference.toml"


[evaluation]
protocol = "config/evaluate/mazehard-hrm-rl/reference.toml"
