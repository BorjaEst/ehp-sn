[dependency-groups]
    dev = [
        "pytest",
        "black",
        "isort",
        "flake8",
        "mypy",
        "import-linter",
        "ruff",
        "pyupgrade",
    ]
    docs = [
        "mkdocs",
        "mkdocstrings[python]",
    ]

[tool.pytest.ini_options]
    testpaths = [
        "packages/ehp-sn/tests",
        "packages/ehp-research/tests",
        "tests",
    ]
    addopts = [
        "--strict-config",
        "--strict-markers",
    ]

[tool.ruff]
    line-length = 100
    target-version = "py312"

[tool.ruff.lint]
    select = [
        "E",
        "F",
        "I",
        "UP",
        "B",
        "SIM",
    ]

[tool.mypy]
    python_version           = "3.12"
    warn_return_any          = false
    warn_unused_configs      = false
    disallow_untyped_defs    = false
    disallow_incomplete_defs = false
